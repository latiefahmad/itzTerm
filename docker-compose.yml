# itzterm-server in a container. Guide: docs/deployment-guide.md, "Run in Docker".
#
#   mkdir -p workspace
#   docker compose up -d
#   docker compose exec itzterm-server cat /home/itzterm/.local/state/itzterm/web-auth-token
#
# Then open http://localhost:8080/#token=<token>.
#
# Optional settings come from the shell or a .env file next to this file:
# ITZTERM_PORT, ITZTERM_WORKSPACE, ITZTERM_IMAGE, ITZTERM_WEB_AUTH_TOKEN,
# ITZTERM_ALLOWED_ORIGINS, and, for `docker compose build`, ITZTERM_RELEASE,
# ITZTERM_UID, and ITZTERM_GID.

name: itzterm

services:
  itzterm-server:
    image: ${ITZTERM_IMAGE:-ghcr.io/latiefahmad/itzTerm-server:latest}
    build:
      context: .
      args:
        ITZTERM_RELEASE: ${ITZTERM_RELEASE:-latest}
        ITZTERM_UID: ${ITZTERM_UID:-1000}
        ITZTERM_GID: ${ITZTERM_GID:-1000}
    restart: unless-stopped
    ports:
      # Loopback only. "8080:8080" or "0.0.0.0:8080:8080" publishes the server
      # on every network the host is on. The auth token still applies, but the
      # server speaks plain HTTP, so the token crosses the network unencrypted.
      # For remote access, put an HTTPS reverse proxy in front instead.
      - "127.0.0.1:${ITZTERM_PORT:-8080}:8080"
    environment:
      # Empty: the server generates a token on first start and keeps it in the
      # itzterm-home volume. A value here replaces that token.
      ITZTERM_WEB_AUTH_TOKEN: ${ITZTERM_WEB_AUTH_TOKEN:-}
      # The public origin of a reverse proxy that rewrites the Host header,
      # for example https://itzterm.example.com. Comma-separate several.
      ITZTERM_ALLOWED_ORIGINS: ${ITZTERM_ALLOWED_ORIGINS:-}
      # Requests reach the container from the Docker network, never from
      # loopback, so without this the server refuses every file and git write
      # from the browser. Writes stay confined to registered projects, and the
      # auth token is still required.
      ITZTERM_SERVER_ALLOW_REMOTE_WRITES: "true"
      # Sessions and the project registry live under --state-dir in the
      # itzterm-home volume. Set these only to move one of them elsewhere.
      # ITZTERM_SESSIONS_DIR: /home/itzterm/.local/state/itzterm/sessions
      # ITZTERM_PROJECTS_FILE: /home/itzterm/.local/state/itzterm/projects.json
    volumes:
      # Server state, the auth token, and the home directory of the user that
      # runs shells and agents (git config, SSH keys, agent logins).
      - itzterm-home:/home/itzterm
      # The only host directory the server can see. Add projects under
      # /workspace in the web UI.
      - type: bind
        source: ${ITZTERM_WORKSPACE:-./workspace}
        target: /workspace
        bind:
          create_host_path: false
    # Hardening. If a tool you run in itzTerm must write outside /home/itzterm,
    # /workspace, or /tmp, remove read_only. /tmp is mounted exec so tools can
    # run helper binaries from it.
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  itzterm-home:
