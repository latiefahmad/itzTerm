name: main

# Verifies every push to main. Release builds live in build.yml (v* tags) and
# PR gating lives in pr-validation.yml, so this is the only workflow that
# guards direct main-line pushes. The repo is public, so standard runners cost
# nothing — keep the heavy local work (full typecheck, test suite, cargo) here
# instead of on contributors' machines.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Biome (lint + format + imports)
        run: bun run ci

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  rust:
    name: Rust Checks
    # Rust only moves when src-tauri, the canvas bundle, or the web client it
    # embeds changes. A documentation or renderer-only push skips this job.
    if: |
      github.event.created == false || github.event.forced == true ||
      contains(join(github.event.commits.*.modified, ' '), 'src-tauri/') ||
      contains(join(github.event.commits.*.added, ' '), 'src-tauri/')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      # rust-embed needs a non-empty dist-web/ for the web::assets OK-path
      # tests, exactly as in pr-validation.yml.
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

      # Warning only: the pin points at a release of the external figcraft fork
      # (`gnoviawan/figcraft`), and that asset is deleted when the fork retires
      # the build. Neither cargo check nor cargo test reads canvas/bundle, so a
      # gap there must not block a push to main; pr-validation.yml keeps the
      # strict download-and-verify check for contributors.
      - name: Check figcraft pin
        run: bun scripts/canvas/check-figcraft-pin.mjs

      - name: Fetch and verify figcraft bundle (canvas/bundle/)
        continue-on-error: true
        run: bun scripts/canvas/fetch-figcraft-bundle.mjs

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
