name: build

# Build/release pipeline. Full 3-OS builds cost ~60-75 Actions minutes per
# trigger on this private repo, so CI only spends them on real releases (v*
# tags); main-line quality gates run locally via `bun run ci` and the cheap
# push workflows (secret scan, actions security). Manual dispatch is kept for
# smoke-testing the pipeline.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            artifact-paths: |
              src-tauri/target/**/bundle/msi/*.msi
              src-tauri/target/**/bundle/msi/*.msi.sig
              src-tauri/target/**/bundle/nsis/*.exe
              src-tauri/target/**/bundle/nsis/*.exe.sig
          - platform: ubuntu-22.04
            args: ""
            artifact-paths: |
              src-tauri/target/**/bundle/appimage/*.AppImage
              src-tauri/target/**/bundle/appimage/*.AppImage.sig
              src-tauri/target/**/bundle/deb/*.deb
              src-tauri/target/**/bundle/rpm/*.rpm
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            artifact-paths: |
              src-tauri/target/**/bundle/dmg/*.dmg
              src-tauri/target/**/bundle/macos/*.app.tar.gz
              src-tauri/target/**/bundle/macos/*.app.tar.gz.sig

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libappindicator3-dev librsvg2-dev patchelf file build-essential

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CI: "true"
        shell: bash
        run: bunx tauri build ${{ matrix.args }} --config src-tauri/tauri.conf.prod.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itzTerm-${{ matrix.platform }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifact tree
        shell: bash
        run: |
          set -euo pipefail
          find dist -mindepth 2 -type f -exec mv '{}' dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          test -n "$(find dist -maxdepth 1 -type f -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.app.tar.gz')"
          find dist -maxdepth 1 -type f -printf '%f\n'

      - name: Generate changelog notes
        id: notes
        env:
          GITHUB_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(git cliff --unreleased --tag "$TAG" --strip all 2>/dev/null || true)"
          if [ -z "$NOTES" ] || [ "$(echo "$NOTES" | grep -c '^- ')" = 0 ]; then
            PREV_TAG="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            {
              echo "### Changes"
              echo
              if [ -n "$PREV_TAG" ]; then
                git log --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "$PREV_TAG..$TAG"
              else
                git log --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))"
              fi
              echo
            } > notes.md
            echo "notes source: git log fallback"
          else
            printf '%s\n' "$NOTES" > notes.md
            echo "notes source: git-cliff conventional commits"
          fi
          cat notes.md

      - name: Prepare updater manifest (latest.json)
        shell: bash
        run: bun scripts/release/ship-release.mjs manifest

      - name: Update CHANGELOG.md
        shell: bash
        run: bun scripts/release/ship-release.mjs bump-changelog --notes notes.md

      - name: Commit CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "itzterm-release-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unchanged"
          else
            git add CHANGELOG.md
            git commit -m "docs(changelog): release ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub release with all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          mapfile -t assets < <(find dist -maxdepth 1 -type f)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "itzTerm v$VERSION" \
              --notes-file notes.md
          else
            echo "release $TAG already exists; uploading assets (--clobber)"
            gh release upload "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          fi

      - name: Mirror updater artifacts to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_MIRROR_BASE_URL: https://updates.latief.id
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare secrets not set; skipping R2 mirror"
            exit 0
          fi
          bun scripts/release/ship-release.mjs mirror
