name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            artifact-paths: |
              src-tauri/target/**/bundle/msi/*.msi
              src-tauri/target/**/bundle/msi/*.msi.sig
              src-tauri/target/**/bundle/nsis/*.exe
              src-tauri/target/**/bundle/nsis/*.exe.sig
          - platform: ubuntu-22.04
            args: ""
            artifact-paths: |
              src-tauri/target/**/bundle/appimage/*.AppImage
              src-tauri/target/**/bundle/deb/*.deb
              src-tauri/target/**/bundle/rpm/*.rpm
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            artifact-paths: |
              src-tauri/target/**/bundle/dmg/*.dmg
              src-tauri/target/**/bundle/macos/*.app
              src-tauri/target/**/bundle/macos/*.app.tar.gz
              src-tauri/target/**/bundle/macos/*.app.tar.gz.sig

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libappindicator3-dev librsvg2-dev patchelf file build-essential

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CI: "true"
        shell: bash
        run: bunx tauri build ${{ matrix.args }} --config src-tauri/tauri.conf.prod.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itzTerm-${{ matrix.platform }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
